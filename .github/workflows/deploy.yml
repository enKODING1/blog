name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # main 에 직접 push 해도 PR 과 같은 검사를 거친다
      - run: npm run lint
      - run: npm run format:check
      - name: Check post image paths
        run: node scripts/check-images.mjs
      - run: npm run build

      # 빌드가 비정상이면 여기서 멈춘다. 아래 sync --delete 가 기존 사이트를 지우는 것을 막는다.
      - name: Check build output
        run: node scripts/check-build.mjs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 해시가 붙은 정적 파일은 오래 캐시, HTML 등 나머지는 매번 재검증
      - name: Upload to S3
        run: |
          aws s3 sync out/_next/static "s3://${{ vars.S3_BUCKET }}/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
