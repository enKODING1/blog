name: CI

# PR 검사. AWS 권한 없이 돈다 (id-token 권한 없음).
# GitHub > Settings > Branches 에서 main 에 아래 job 들을 required check 로 지정한다.
# main 보호가 꺼져 있어 직접 push 도 검사한다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Check build output
        run: node scripts/check-build.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive

      # backend 없이 provider 스키마만으로 검사한다 (AWS·Cloudflare 자격 증명 불필요)
      - name: Validate infra
        working-directory: infra
        run: terraform init -backend=false && terraform validate

      - name: Validate infra-shared/auth
        working-directory: infra-shared/auth
        run: terraform init -backend=false && terraform validate

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - run: pip install cargo-lambda

      - name: Check / Test / Build
        working-directory: api
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo lambda build --release --arm64
